spring:
  config:
    import: optional:file:./.env.prod[.properties]
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

app:
  public-url: ${APP_PUBLIC_URL}
  gmail:
    oauth-enabled: ${GMAIL_OAUTH_ENABLED:true}
    client-id: ${GOOGLE_GMAIL_CLIENT_ID}
    client-secret: ${GOOGLE_GMAIL_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_GMAIL_REDIRECT_URI}
    token-encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY}
    oauth-state-ttl: ${GMAIL_OAUTH_STATE_TTL:PT10M}
    outbox-retention: ${GMAIL_OUTBOX_RETENTION:PT72H}
    http-timeout: ${GMAIL_HTTP_TIMEOUT:PT10S}
    key-version: ${GMAIL_TOKEN_KEY_VERSION:1}
  security:
    jwt-secret: ${JWT_SECRET}
  content:
    storage-root: ${STORAGE_ROOT}
    staging-root: ${STAGING_ROOT}
    default-tenant-quota-bytes: ${TENANT_DEFAULT_QUOTA_BYTES:53687091200}
    clamav-host: ${CLAMAV_HOST:clamav}
    clamav-port: ${CLAMAV_PORT:3310}
    clamav-enabled: ${CLAMAV_ENABLED:true}
    maintenance-flag-path: ${MAINTENANCE_FLAG_PATH:/maintenance/maintenance.flag}
    backup-directory: ${BACKUP_DIRECTORY}
    backup-retention-days: ${BACKUP_RETENTION_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  seed:
    default-password: ${DEFAULT_ACCOUNT_PASSWORD}
    admin:
      username: ${PLATFORM_ADMIN_USERNAME}
      password: ${PLATFORM_ADMIN_PASSWORD}
      email: ${PLATFORM_ADMIN_EMAIL}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
