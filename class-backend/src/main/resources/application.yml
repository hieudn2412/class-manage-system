spring:
  application:
    name: class-backend
  config:
    import: optional:file:./.env[.properties]
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55433/class_management}
    username: ${DATABASE_USERNAME:class_app}
    password: ${DATABASE_PASSWORD:class_app_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  public-url: ${APP_PUBLIC_URL:http://localhost:5173}
  gmail:
    oauth-enabled: ${GMAIL_OAUTH_ENABLED:false}
    client-id: ${GOOGLE_GMAIL_CLIENT_ID:}
    client-secret: ${GOOGLE_GMAIL_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_GMAIL_REDIRECT_URI:http://localhost:8080/api/v1/oauth/google/gmail/callback}
    token-encryption-key: ${GMAIL_TOKEN_ENCRYPTION_KEY:}
    oauth-state-ttl: ${GMAIL_OAUTH_STATE_TTL:PT10M}
    outbox-retention: ${GMAIL_OUTBOX_RETENTION:PT72H}
    http-timeout: ${GMAIL_HTTP_TIMEOUT:PT10S}
    authorization-uri: ${GOOGLE_GMAIL_AUTHORIZATION_URI:https://accounts.google.com/o/oauth2/v2/auth}
    token-uri: ${GOOGLE_GMAIL_TOKEN_URI:https://oauth2.googleapis.com/token}
    user-info-uri: ${GOOGLE_GMAIL_USER_INFO_URI:https://openidconnect.googleapis.com/v1/userinfo}
    send-uri: ${GOOGLE_GMAIL_SEND_URI:https://gmail.googleapis.com/gmail/v1/users/me/messages/send}
    key-version: ${GMAIL_TOKEN_KEY_VERSION:1}
  security:
    jwt-secret: ${JWT_SECRET:dev-only-secret-must-be-at-least-32-bytes-long}
    access-token-ttl: ${ACCESS_TOKEN_TTL:PT8H}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    login-block-duration: ${LOGIN_BLOCK_DURATION:PT1M}
  scheduling:
    zone-id: Asia/Ho_Chi_Minh
    preview-ttl: ${PREVIEW_TTL:PT15M}
    max-generation-days: ${MAX_GENERATION_DAYS:3660}
  teaching:
    zone-id: Asia/Ho_Chi_Minh
    check-in-before-start: PT30M
    scheduler-delay-ms: ${TEACHING_SCHEDULER_DELAY_MS:30000}
  content:
    storage-root: ${STORAGE_ROOT:./var/private-files}
    staging-root: ${STAGING_ROOT:./var/staging-files}
    default-tenant-quota-bytes: ${TENANT_DEFAULT_QUOTA_BYTES:53687091200}
    staging-ttl: ${STAGING_TTL:PT24H}
    image-limit-bytes: ${FILE_IMAGE_LIMIT_BYTES:52428800}
    submission-image-limit-bytes: ${FILE_SUBMISSION_IMAGE_LIMIT_BYTES:10485760}
    document-limit-bytes: ${FILE_DOCUMENT_LIMIT_BYTES:52428800}
    audio-limit-bytes: ${FILE_AUDIO_LIMIT_BYTES:209715200}
    submission-max-files: ${SUBMISSION_MAX_FILES:10}
    clamav-host: ${CLAMAV_HOST:localhost}
    clamav-port: ${CLAMAV_PORT:3310}
    clamav-timeout: ${CLAMAV_TIMEOUT:PT10S}
    clamav-enabled: ${CLAMAV_ENABLED:false}
    maintenance-flag-path: ${MAINTENANCE_FLAG_PATH:./var/maintenance.flag}
    backup-directory: ${BACKUP_DIRECTORY:./var/backups}
    backup-retention-days: ${BACKUP_RETENTION_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4173,http://127.0.0.1:4173,http://localhost:4173,http://127.0.0.1:4173}
  seed:
    default-password: ${DEFAULT_ACCOUNT_PASSWORD:123456}
    admin:
      username: ${PLATFORM_ADMIN_USERNAME:superadmin}
      password: ${PLATFORM_ADMIN_PASSWORD:123456}
      email: ${PLATFORM_ADMIN_EMAIL:superadmin@example.local}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.classops.backend

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
