    SalaryPaymentInput:
      type: object
      required: [teacherId, salaryMonth, paidAt, amount, method, confirmOverpayment]
      properties:
        teacherId: {type: string, format: uuid}
        salaryMonth: {type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$"}
        paidAt: {type: string, format: date}
        amount: {type: number, exclusiveMinimum: 0}
        method: {type: string, enum: [CASH, BANK_TRANSFER]}
        reference: {type: [string, "null"], maxLength: 250}
        confirmOverpayment: {type: boolean}
        overpaymentReason: {type: [string, "null"], maxLength: 1000}
    SalaryPaymentUpdate:
      allOf:
        - {$ref: "#/components/schemas/SalaryPaymentInput"}
        - type: object
          required: [editReason, version]
          properties:
            editReason: {type: string, minLength: 1, maxLength: 1000}
            version: {type: integer, format: int64, minimum: 0}
    PayrollMetrics:
      type: object
      required: [sessionCount, totalMinutes, accrued, adjustments, due, paid, outstanding]
      properties:
        sessionCount: {type: integer, format: int64, minimum: 0}
        totalMinutes: {type: integer, format: int64, minimum: 0}
        accrued: {type: number}
        adjustments: {type: number}
        due: {type: number}
        paid: {type: number}
        outstanding: {type: number}
        status: {type: string, enum: [OWED, SETTLED, OVERPAID]}
    PayrollTeacherRow:
      allOf:
        - {$ref: "#/components/schemas/PayrollMetrics"}
        - type: object
          required: [teacherId, teacherName]
          properties:
            teacherId: {type: string, format: uuid}
            teacherName: {type: string}
    PayrollPage:
      type: object
      required: [month, metrics, teachers]
      properties:
        month: {type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$"}
        metrics: {$ref: "#/components/schemas/PayrollMetrics"}
        teachers:
          allOf:
            - {$ref: "#/components/schemas/Page"}
            - type: object
              properties: {items: {type: array, items: {$ref: "#/components/schemas/PayrollTeacherRow"}}}
    TeacherPayrollDetail:
      type: object
      required: [month, teacherId, teacherName, metrics, accruals, adjustments, payments]
      properties:
        month: {type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$"}
        teacherId: {type: string, format: uuid}
        teacherName: {type: string}
        metrics: {$ref: "#/components/schemas/PayrollMetrics"}
        accruals: {type: array, items: {type: object}}
        adjustments: {type: array, items: {type: object}}
        payments: {type: array, items: {type: object}}
    Page:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items: {type: array, items: {}}
        page: {type: integer, minimum: 1}
        pageSize: {type: integer, minimum: 1}
        totalItems: {type: integer, format: int64}
        totalPages: {type: integer}
    Problem:
      type: object
      required: [type, title, status, detail, code, message, timestamp, traceId]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        message: {type: string}
        fieldErrors: {type: object, additionalProperties: {type: string}}
        details: {type: object, additionalProperties: true}
        retryAfterSeconds: {type: integer, minimum: 1}
        timestamp: {type: string, format: date-time}
        traceId: {type: string}
