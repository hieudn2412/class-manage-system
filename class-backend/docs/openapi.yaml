openapi: 3.1.0
info:
  title: Class Operations API
  version: 1.6.0
  license:
    name: Proprietary
    identifier: LicenseRef-ClassOps-Proprietary
  description: |
    API cho các màn React hiện có: xác thực, lập lịch lớp và vận hành giáo viên.
    JWT có `accountScope=PLATFORM|TENANT`; tenant chỉ được suy ra cho phiên TENANT.
    API tạo lớp/ca/override không nhận link online theo DEC-046.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Platform administration
    description: Super Admin quản lý tenant và Admin ban đầu, không truy cập nghiệp vụ tenant.
  - name: Tenant accounts
    description: Admin quản lý toàn bộ tài khoản; Học vụ chỉ quản lý GV/HS thuần.
  - name: Authentication
    description: Tenant resolution, JWT login and temporary-password lifecycle.
  - name: Management dashboard
    description: Tenant-scoped operational KPIs and attention items.
  - name: Class scheduling
    description: Draft, preview, publish and lookup APIs for class planning.
  - name: Weekly schedules
    description: Tenant-wide and teacher-specific calendars plus one-session overrides.
  - name: Teaching operations
    description: Dashboard giáo viên, lớp/buổi trong phạm vi, check-in và hồ sơ sư phạm.
  - name: Class lifecycle and enrollments
    description: Vòng đời sau publish, lịch sử enrollment và học phí gốc nguyên tử.
  - name: Student learning
    description: Lớp và nội dung buổi của chính học sinh, có kiểm tra quyền tại thời điểm đọc.
  - name: Salary and payroll
    description: Đơn giá hiệu lực, accrual có revision, điều chỉnh, thanh toán và bảng lương trực tiếp.
  - name: Homework and materials
    description: FL-10 BTVN, tài liệu private, upload staging, notification và quota.
  - name: Tenant Gmail connection
    description: FL-10.1 Gmail OAuth sender riêng từng tenant, không dùng SMTP global.
paths:
  /tenant-email-connection:
    get:
      operationId: getTenantEmailConnection
      tags: [Tenant Gmail connection]
      summary: Xem trạng thái Gmail thông báo của tenant
      responses:
        "200":
          description: Trạng thái kết nối; chưa kết nối không trả 404
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TenantEmailConnection"}
        "403": {$ref: "#/components/responses/Forbidden"}
    delete:
      operationId: disconnectTenantEmailConnection
      tags: [Tenant Gmail connection]
      summary: Ngắt Gmail khỏi tenant hiện tại và xóa token cục bộ
      parameters:
        - {name: version, in: query, required: true, schema: {type: integer, format: int64, minimum: 0}}
      responses:
        "204": {description: Đã ngắt kết nối}
        "409": {$ref: "#/components/responses/Conflict"}
  /tenant-email-connection/oauth-authorizations:
    post:
      operationId: createTenantGmailAuthorization
      tags: [Tenant Gmail connection]
      summary: Tạo Google OAuth authorization URL với state và PKCE
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      responses:
        "201":
          description: URL chuyển hướng sang Google
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GmailAuthorization"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /tenant-email-connection/test-messages:
    post:
      operationId: sendTenantGmailTestMessage
      tags: [Tenant Gmail connection]
      summary: Gửi đồng bộ một email thử qua Gmail tenant
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recipientEmail: {type: string, format: email}
      responses:
        "200":
          description: Gmail message id
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TestGmailResult"}
        "409": {$ref: "#/components/responses/Conflict"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /oauth/google/gmail/callback:
    get:
      operationId: handleTenantGmailCallback
      tags: [Tenant Gmail connection]
      security: []
      summary: Public callback duy nhất từ Google OAuth
      parameters:
        - {name: state, in: query, schema: {type: string}}
        - {name: code, in: query, schema: {type: string}}
        - {name: error, in: query, schema: {type: string}}
      responses:
        "303":
          description: Redirect về màn Gmail tenant với gmailResult đã sanitize
  /uploads/staging:
    post:
      operationId: stagePrivateFile
      tags: [Homework and materials]
      summary: Upload một file vào staging token 24 giờ
      parameters:
        - name: purpose
          in: query
          required: true
          schema: {type: string, enum: [HOMEWORK_ATTACHMENT, SUBMISSION_IMAGE, REVIEW_ATTACHMENT, MATERIAL]}
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200": {description: Token staging, content: {application/json: {schema: {$ref: "#/components/schemas/StoredFile"}}}}
        "400": {$ref: "#/components/responses/ValidationError"}
        "409": {$ref: "#/components/responses/Conflict"}
  /files/{fileId}/content:
    get:
      operationId: downloadPrivateFile
      tags: [Homework and materials]
      summary: Xem/tải file private, kiểm quyền tại thời điểm đọc
      parameters:
        - {name: fileId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Range, in: header, schema: {type: string}}
      responses:
        "200": {description: Nội dung file}
        "206": {description: Nội dung file theo Range}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /classes/{classId}/homeworks:
    get:
      operationId: listClassHomeworks
      tags: [Homework and materials]
      parameters:
        - {$ref: "#/components/parameters/ClassId"}
        - {name: sessionId, in: query, schema: {type: string, format: uuid}, description: Lọc BTVN gắn với một buổi cụ thể}
        - {name: status, in: query, schema: {type: string, enum: [DRAFT, PUBLISHED, CLOSED]}, description: Lọc theo trạng thái BTVN}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses: {"200": {description: Trang BTVN, content: {application/json: {schema: {$ref: "#/components/schemas/HomeworkPage"}}}}}
    post:
      operationId: createHomework
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/ClassId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/HomeworkInput"}}}}
      responses:
        "200": {description: BTVN đã được giao ngay, content: {application/json: {schema: {$ref: "#/components/schemas/HomeworkDetail"}}}}
        "409": {$ref: "#/components/responses/Conflict"}
  /homeworks/{id}:
    get:
      operationId: getHomework
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Chi tiết BTVN, content: {application/json: {schema: {$ref: "#/components/schemas/HomeworkDetail"}}}}}
    patch:
      operationId: updateHomework
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/HomeworkUpdate"}}}}
      responses: {"200": {description: BTVN đã cập nhật}}
  /homeworks/{id}/publish:
    post:
      operationId: publishHomework
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/VersionOnly"}
      responses: {"200": {description: BTVN Published}}
  /homeworks/{id}/close:
    post:
      operationId: closeHomework
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {$ref: "#/components/requestBodies/VersionOnly"}
      responses: {"200": {description: BTVN Closed}}
  /homeworks/{id}/reopen:
    post:
      operationId: reopenHomework
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason, version], properties: {reason: {type: string}, version: {type: integer}}}}}}
      responses: {"200": {description: BTVN mở lại}}
  /students/me/homeworks:
    get:
      operationId: listMyHomeworks
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PageSize"}]
      responses: {"200": {description: BTVN của học sinh, content: {application/json: {schema: {$ref: "#/components/schemas/StudentHomeworkPage"}}}}}
  /students/me/homeworks/{id}:
    get:
      operationId: getMyHomework
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses:
        "200": {description: Chi tiết BTVN của học sinh, content: {application/json: {schema: {$ref: "#/components/schemas/StudentHomeworkDetail"}}}}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
  /students/me/homeworks/{id}/submissions:
    post:
      operationId: submitHomework
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/Id"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SubmissionInput"}}}}
      responses: {"200": {description: Lượt nộp mới, content: {application/json: {schema: {$ref: "#/components/schemas/Submission"}}}}}
  /homeworks/{homeworkId}/submissions/{submissionId}/reviews:
    post:
      operationId: reviewSubmission
      tags: [Homework and materials]
      parameters:
        - {name: homeworkId, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: submissionId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ReviewInput"}}}}
      responses: {"200": {description: Lượt nộp sau review}}
  /classes/{classId}/materials:
    get:
      operationId: listMaterials
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/ClassId"}, {$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PageSize"}]
      responses: {"200": {description: Trang tài liệu, content: {application/json: {schema: {$ref: "#/components/schemas/MaterialPage"}}}}}
    post:
      operationId: createMaterial
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/ClassId"}, {$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/MaterialInput"}}}}
      responses: {"200": {description: Tài liệu mới, content: {application/json: {schema: {$ref: "#/components/schemas/Material"}}}}}
  /notifications:
    get:
      operationId: listNotifications
      tags: [Homework and materials]
      responses: {"200": {description: Thông báo phân trang}}
  /storage/usage:
    get:
      operationId: getTenantStorageUsage
      tags: [Homework and materials]
      responses: {"200": {description: Dung lượng tenant, content: {application/json: {schema: {$ref: "#/components/schemas/TenantStorageUsage"}}}}}
  /platform/tenants/{id}/quota:
    get:
      operationId: getTenantQuota
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Quota tenant}}
    patch:
      operationId: updateTenantQuota
      tags: [Homework and materials]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [quotaBytes, version], properties: {quotaBytes: {type: integer, format: int64}, version: {type: integer}}}}}}
      responses: {"200": {description: Quota mới}}
  /platform/auth/login:
    post:
      operationId: platformLogin
      tags: [Platform administration]
      security: []
      summary: Đăng nhập Super Admin không cần tenant slug
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/LoginCredentials"}}}}
      responses:
        "200": {description: Phiên PLATFORM, content: {application/json: {schema: {$ref: "#/components/schemas/AuthSession"}}}}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /platform/tenants:
    get:
      operationId: listPlatformTenants
      summary: Tìm, lọc và phân trang tenant
      tags: [Platform administration]
      parameters: [{$ref: "#/components/parameters/Search"}, {$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PageSize"}, {name: status, in: query, schema: {type: string, enum: [ACTIVE, LOCKED]}}]
      responses: {"200": {description: Danh sách 1-based tối đa 100}}
    post:
      operationId: createPlatformTenant
      summary: Tạo nguyên tử tenant và Admin ban đầu
      tags: [Platform administration]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateTenant"}}}}
      responses: {"201": {description: Tenant + Admin ban đầu + mật khẩu 123456}, "409": {$ref: "#/components/responses/Conflict"}}
  /platform/tenants/{id}:
    get:
      operationId: getPlatformTenant
      summary: Xem tenant và Admin ban đầu
      tags: [Platform administration]
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Chi tiết tenant}, "404": {$ref: "#/components/responses/NotFound"}}
    patch:
      operationId: renamePlatformTenant
      summary: Đổi tên tenant với optimistic version
      tags: [Platform administration]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [name, version], properties: {name: {type: string}, version: {type: integer}}}}}}
      responses: {"200": {description: Tenant đã cập nhật}, "409": {$ref: "#/components/responses/Conflict"}}
  /platform/tenants/{id}/status:
    patch:
      operationId: changePlatformTenantStatus
      summary: Khóa hoặc mở tenant
      tags: [Platform administration]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {$ref: "#/components/requestBodies/StatusChange"}
      responses: {"200": {description: ACTIVE hoặc LOCKED}, "409": {$ref: "#/components/responses/Conflict"}}
  /platform/tenants/{id}/initial-administrator/status:
    patch:
      operationId: changeInitialAdministratorStatus
      summary: Khóa hoặc mở Admin ban đầu
      tags: [Platform administration]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {$ref: "#/components/requestBodies/StatusChange"}
      responses: {"200": {description: Admin ban đầu đã cập nhật}}
  /platform/tenants/{id}/initial-administrator/credential-resets:
    post:
      operationId: resetInitialAdministratorCredential
      summary: Reset credential Admin ban đầu
      tags: [Platform administration]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {$ref: "#/components/requestBodies/CredentialReset"}
      responses: {"200": {description: "Mật khẩu 123456, READY và token cũ bị thu hồi"}, "409": {$ref: "#/components/responses/Conflict"}}
  /accounts:
    get:
      operationId: listTenantAccounts
      summary: Tìm, lọc và phân trang tài khoản tenant
      tags: [Tenant accounts]
      parameters: [{$ref: "#/components/parameters/Search"}, {$ref: "#/components/parameters/Page"}, {$ref: "#/components/parameters/PageSize"}, {name: status, in: query, schema: {type: string}}, {name: role, in: query, schema: {type: string}}, {name: profileType, in: query, schema: {type: string}}]
      responses: {"200": {description: PageResponse tài khoản trong tenant JWT}}
    post:
      operationId: createTenantAccount
      summary: Tạo tài khoản và hồ sơ tối thiểu
      tags: [Tenant accounts]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/CreateAccount"}}}}
      responses: {"201": {description: Tài khoản READY + mật khẩu 123456}, "409": {$ref: "#/components/responses/Conflict"}}
  /accounts/{id}:
    get:
      operationId: getTenantAccount
      summary: Xem một tài khoản trong phạm vi quyền
      tags: [Tenant accounts]
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Chi tiết tài khoản}, "404": {$ref: "#/components/responses/NotFound"}}
    patch:
      operationId: updateTenantAccount
      summary: Sửa tên, email, vai trò và phụ huynh
      tags: [Tenant accounts]
      parameters: [{$ref: "#/components/parameters/Id"}]
      responses: {"200": {description: Hồ sơ/vai trò đã cập nhật}, "409": {$ref: "#/components/responses/Conflict"}}
  /accounts/{id}/status:
    patch:
      operationId: changeTenantAccountStatus
      summary: Khóa hoặc mở tài khoản tenant
      tags: [Tenant accounts]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {$ref: "#/components/requestBodies/StatusChange"}
      responses: {"200": {description: Trạng thái đã cập nhật}, "409": {$ref: "#/components/responses/Conflict"}}
  /accounts/{id}/credential-resets:
    post:
      operationId: resetTenantAccountCredential
      summary: Reset credential và thu hồi JWT cũ
      tags: [Tenant accounts]
      parameters: [{$ref: "#/components/parameters/Id"}]
      requestBody: {$ref: "#/components/requestBodies/CredentialReset"}
      responses: {"200": {description: Mật khẩu 123456 và token cũ bị thu hồi}}
  /tenants/{slug}:
    get:
      operationId: getTenant
      tags: [Authentication]
      security: []
      summary: Lấy thông tin tenant trước đăng nhập
      parameters:
        - $ref: "#/components/parameters/TenantSlug"
      responses:
        "200":
          description: Tenant tồn tại
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Tenant"}
        "404": {$ref: "#/components/responses/NotFound"}
        "423": {$ref: "#/components/responses/Locked"}
  /auth/login:
    post:
      operationId: login
      tags: [Authentication]
      security: []
      summary: Đăng nhập trong một tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                tenantSlug: {type: string, example: anh-duong}
                username: {type: string, example: admin.anhduong}
                password: {type: string, format: password, example: Demo@123}
      responses:
        "200":
          description: JWT và hồ sơ phiên
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "423": {$ref: "#/components/responses/Locked"}
        "429": {$ref: "#/components/responses/TooManyRequests"}
  /auth/forgot-password:
    post:
      operationId: requestPasswordReset
      tags: [Authentication]
      security: []
      summary: Ghi nhận yêu cầu quên mật khẩu mà không tiết lộ tài khoản
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tenantSlug, username]
              properties:
                tenantSlug: {type: string, example: anh-duong}
                username: {type: string, example: admin.anhduong}
      responses:
        "202":
          description: Luôn trả cùng một thông điệp xác nhận
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MessageResponse"}
        "400": {$ref: "#/components/responses/ValidationError"}
  /auth/change-password:
    post:
      operationId: changeTemporaryPassword
      tags: [Authentication]
      summary: Đổi mật khẩu tạm và phát hành JWT mới
      description: JWT cũ mất hiệu lực sau khi tokenVersion được tăng.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties:
                newPassword: {type: string, format: password, minLength: 8}
      responses:
        "200":
          description: Phiên mới có passwordState READY
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AuthSession"}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409": {$ref: "#/components/responses/Conflict"}
  /dashboard:
    get:
      operationId: getManagementDashboard
      tags: [Management dashboard]
      summary: Dashboard vận hành của tenant trong JWT
      responses:
        "200":
          description: KPI và việc cần xử lý từ dữ liệu PostgreSQL
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DashboardData"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /class-scheduling/options:
    get:
      operationId: getClassSchedulingOptions
      tags: [Class scheduling]
      summary: Danh sách giáo viên và phòng thuộc tenant
      responses:
        "200":
          description: Options
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SchedulingOptions"}
        "403": {$ref: "#/components/responses/Forbidden"}
  /students:
    get:
      operationId: searchStudents
      tags: [Class scheduling]
      summary: Tìm học sinh có sẵn để quản lý thêm vào lớp
      parameters:
        - {$ref: "#/components/parameters/Search"}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
      responses:
        "200":
          description: Trang học sinh (1-based)
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/Page"}
                  - type: object
                    properties:
                      items:
                        type: array
                        items: {$ref: "#/components/schemas/StudentOption"}
        "400": {$ref: "#/components/responses/ValidationError"}
  /class-scheduling/previews:
    post:
      operationId: createClassSchedulePreview
      tags: [Class scheduling]
      summary: Sinh preview lịch và xung đột
      description: Preview có TTL và không giữ chỗ. Publish luôn kiểm tra lại.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClassDraftInput"}
      responses:
        "200":
          description: Preview mới
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SchedulePreview"}
        "400": {$ref: "#/components/responses/ValidationError"}
  /classes:
    get:
      operationId: listClasses
      tags: [Class scheduling]
      summary: Danh sách lớp tenant
      parameters:
        - {$ref: "#/components/parameters/Search"}
        - {name: month, in: query, schema: {type: string, pattern: '^\d{4}-\d{2}$'}}
        - {name: status, in: query, schema: {type: string}}
        - {name: teacherId, in: query, schema: {type: string, format: uuid}}
        - {$ref: "#/components/parameters/Page"}
        - {$ref: "#/components/parameters/PageSize"}
