      tags: [Salary and payroll]
      parameters:
        - {$ref: "#/components/parameters/TeacherId"}
        - {$ref: "#/components/parameters/SalaryMonth"}
      responses: {"200": {description: Chi tiết accrual, điều chỉnh và thanh toán, content: {application/json: {schema: {$ref: "#/components/schemas/TeacherPayrollDetail"}}}}}
  /teachers/me/salary:
    get:
      operationId: getOwnSalary
      tags: [Salary and payroll]
      parameters: [{$ref: "#/components/parameters/SalaryMonth"}]
      responses: {"200": {description: Lương của giáo viên đang đăng nhập, content: {application/json: {schema: {$ref: "#/components/schemas/TeacherPayrollDetail"}}}}, "403": {$ref: "#/components/responses/Forbidden"}}
  /salary/adjustments:
    post:
      operationId: createSalaryAdjustment
      tags: [Salary and payroll]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SalaryAdjustmentInput"}}}}
      responses: {"201": {description: Điều chỉnh đã ghi sổ}, "409": {$ref: "#/components/responses/Conflict"}}
  /salary/adjustments/{adjustmentId}:
    patch:
      operationId: updateSalaryAdjustment
      tags: [Salary and payroll]
      parameters: [{name: adjustmentId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SalaryAdjustmentUpdate"}}}}
      responses: {"200": {description: Điều chỉnh đã sửa và audit before/after}, "409": {$ref: "#/components/responses/Conflict"}}
  /salary/payments:
    post:
      operationId: createSalaryPayment
      tags: [Salary and payroll]
      parameters: [{$ref: "#/components/parameters/IdempotencyKey"}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SalaryPaymentInput"}}}}
      responses: {"201": {description: Thanh toán đã ghi sổ}, "409": {$ref: "#/components/responses/Conflict"}}
  /salary/payments/{paymentId}:
    patch:
      operationId: updateSalaryPayment
      tags: [Salary and payroll]
      parameters: [{name: paymentId, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/SalaryPaymentUpdate"}}}}
      responses: {"200": {description: Thanh toán đã sửa và audit before/after}, "409": {$ref: "#/components/responses/Conflict"}}
  /salary/payroll/export:
    get:
      operationId: exportSalaryPayroll
      tags: [Salary and payroll]
      parameters: [{$ref: "#/components/parameters/SalaryMonth"}, {$ref: "#/components/parameters/Search"}]
      responses:
        "200":
          description: Workbook tổng hợp và chi tiết theo bộ lọc
          content: {application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {schema: {type: string, format: binary}}}
  /finance/salary-summary:
    get:
      operationId: getSalaryFinanceSummary
      tags: [Salary and payroll]
      parameters: [{name: year, in: query, required: true, schema: {type: integer, minimum: 2000, maximum: 2200}}]
      responses: {"200": {description: Series 12 tháng gồm kỳ lương và dòng tiền ngày trả}}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    TenantSlug: {name: slug, in: path, required: true, schema: {type: string}}
    ClassId: {name: classId, in: path, required: true, schema: {type: string, format: uuid}}
    SessionId: {name: sessionId, in: path, required: true, schema: {type: string, format: uuid}}
    TeacherId: {name: teacherId, in: path, required: true, schema: {type: string, format: uuid}}
    SalaryMonth: {name: month, in: query, required: true, schema: {type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$"}}
    TestId: {name: testId, in: path, required: true, schema: {type: string, format: uuid}}
    Search: {name: search, in: query, schema: {type: string, default: ""}}
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
    WeekStart:
      name: weekStart
      in: query
      required: true
      description: Thứ Hai theo Asia/Ho_Chi_Minh
      schema: {type: string, format: date}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 150}
  requestBodies:
    StatusChange:
      required: true
      content: {application/json: {schema: {type: object, required: [status, reason, version], properties: {status: {type: string, enum: [ACTIVE, LOCKED]}, reason: {type: string}, version: {type: integer, minimum: 0}}}}}
    CredentialReset:
      required: true
      content: {application/json: {schema: {type: object, required: [reason, version], properties: {reason: {type: string}, version: {type: integer, minimum: 0}}}}}
    VersionOnly:
      required: true
      content: {application/json: {schema: {type: object, required: [version], properties: {version: {type: integer, minimum: 0}}}}}
  responses:
    ValidationError:
      description: Dữ liệu không hợp lệ
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unauthorized:
      description: JWT không hợp lệ
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Forbidden:
      description: Không có quyền
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    NotFound:
      description: Không tìm thấy tài nguyên trong tenant
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Conflict:
      description: |
        Preview stale, TEACHER_OVERLAP, ROOM_OVERLAP, STUDENT_OVERLAP,
        optimistic lock hoặc idempotency conflict.
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    Locked:
      description: Tenant hoặc tài khoản đã bị khóa mềm
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
    TooManyRequests:
      description: Vượt ngưỡng đăng nhập sai theo tài khoản hoặc địa chỉ
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/problem+json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    StoredFile:
      type: object
      required: [id, originalFilename, contentType, sizeBytes, checksumSha256, url, previewUrl]
      properties:
        id: {type: string, format: uuid}
        token: {type: [string, "null"], description: Chỉ trả khi file còn ở staging}
        originalFilename: {type: string}
        contentType: {type: string}
        sizeBytes: {type: integer, format: int64}
        checksumSha256: {type: string}
        expiresAt: {type: [string, "null"], format: date-time}
        url: {type: string}
        previewUrl: {type: string}
    HomeworkInput:
      type: object
      required: [title, audienceType]
      properties:
        sessionId: {type: [string, "null"], format: uuid}
        title: {type: string}
        description: {type: string}
        deadlineAt: {type: [string, "null"], format: date-time}
        audienceType: {type: string, enum: [CLASS, SELECTED]}
        studentIds: {type: array, items: {type: string, format: uuid}}
        fileTokens: {type: array, items: {type: string}}
        links:
          type: array
          items:
            type: object
            required: [label, url]
            properties: {label: {type: string}, url: {type: string, format: uri}}
    HomeworkUpdate:
      type: object
      required: [title, version]
      properties:
        title: {type: string}
        description: {type: string}
        deadlineAt: {type: [string, "null"], format: date-time}
        fileIds:
          type: array
          description: File hiện hành của BTVN muốn giữ lại khi sửa.
          items: {type: string, format: uuid}
        fileTokens:
          type: array
          description: File staging mới cần promote vào BTVN.
          items: {type: string}
        links:
          type: array
          items:
            type: object
            required: [label, url]
            properties: {label: {type: string}, url: {type: string, format: uri}}
        version: {type: integer, minimum: 0}
    HomeworkSummary:
      type: object
      required: [id, classId, classCode, className, title, status, recipientCount, submittedCount, reviewedCount, version]
      properties:
        id: {type: string, format: uuid}
        classId: {type: string, format: uuid}
        sessionId: {type: [string, "null"], format: uuid}
        classCode: {type: string}
        className: {type: string}
        sessionOrdinal: {type: [integer, "null"]}
        title: {type: string}
        status: {type: string, enum: [DRAFT, PUBLISHED, CLOSED]}
        deadlineAt: {type: [string, "null"], format: date-time}
        recipientCount: {type: integer}
        submittedCount: {type: integer}
        reviewedCount: {type: integer}
        version: {type: integer}
    StudentHomeworkSummary:
      allOf:
        - {$ref: "#/components/schemas/HomeworkSummary"}
        - type: object
          required: [mySubmissionStatus, deadlineState, canSubmit]
          properties:
            mySubmissionStatus: {type: string, enum: [ASSIGNED, WAITING_REVIEW, REVIEWED, REVISION_REQUESTED]}
            latestSubmissionAt: {type: [string, "null"], format: date-time}
            deadlineState: {type: string, enum: [NO_DEADLINE, UPCOMING, OVERDUE, CLOSED]}
            canSubmit: {type: boolean}
    HomeworkDetail:
      allOf:
        - {$ref: "#/components/schemas/HomeworkSummary"}
        - type: object
          properties:
            description: {type: string}
            audienceType: {type: string, enum: [CLASS, SELECTED]}
            resources: {type: array, items: {type: object}}
            recipients: {type: array, items: {type: object}}
            submissions: {type: array, items: {$ref: "#/components/schemas/Submission"}}
    StudentHomeworkDetail:
      allOf:
        - {$ref: "#/components/schemas/StudentHomeworkSummary"}
        - type: object
          properties:
            description: {type: string}
            audienceType: {type: string, enum: [CLASS, SELECTED]}
            publishedAt: {type: [string, "null"], format: date-time}
            closedAt: {type: [string, "null"], format: date-time}
            resources: {type: array, items: {type: object}}
            myRecipient: {type: object}
            mySubmissions: {type: array, items: {$ref: "#/components/schemas/Submission"}}
    HomeworkPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - type: object
          properties: {items: {type: array, items: {$ref: "#/components/schemas/HomeworkSummary"}}}
    StudentHomeworkPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - type: object
          properties: {items: {type: array, items: {$ref: "#/components/schemas/StudentHomeworkSummary"}}}
    SubmissionInput:
      type: object
      required: [fileTokens]
      properties:
        note: {type: string}
        fileTokens: {type: array, maxItems: 10, items: {type: string}}
    Submission:
      type: object
      additionalProperties: true
      properties:
        id: {type: string, format: uuid}
        reviewStatus: {type: string, enum: [WAITING_REVIEW, REVIEWED, REVISION_REQUESTED]}
        version: {type: integer}
    ReviewInput:
      type: object
      required: [status, submissionVersion]
      properties:
        status: {type: string, enum: [REVIEWED, REVISION_REQUESTED]}
        comment: {type: string}
        fileTokens: {type: array, items: {type: string}}
        submissionVersion: {type: integer, minimum: 0}
    MaterialInput:
      type: object
      required: [title, fileToken]
      properties:
        sessionId: {type: [string, "null"], format: uuid}
        title: {type: string}
        description: {type: string}
        fileToken: {type: string}
    Material:
      type: object
      additionalProperties: true
      properties:
        id: {type: string, format: uuid}
        title: {type: string}
        file: {$ref: "#/components/schemas/StoredFile"}
        version: {type: integer}
    MaterialPage:
      allOf:
        - {$ref: "#/components/schemas/Page"}
        - type: object
          properties: {items: {type: array, items: {$ref: "#/components/schemas/Material"}}}
    TenantEmailConnection:
      type: object
      required: [status, oauthConfigured, pendingEmailCount, version]
      properties:
        status: {type: string, enum: [NOT_CONNECTED, CONNECTED, REAUTH_REQUIRED, DISCONNECTED]}
        oauthConfigured: {type: boolean}
        gmailAddressMasked: {type: [string, "null"]}
        gmailAddress: {type: [string, "null"], format: email}
        connectedBy: {type: [string, "null"]}
        connectedAt: {type: [string, "null"], format: date-time}
        lastSuccessfulSendAt: {type: [string, "null"], format: date-time}
        lastErrorCode: {type: [string, "null"]}
        lastErrorMessage: {type: [string, "null"]}
        lastErrorAt: {type: [string, "null"], format: date-time}
        pendingEmailCount: {type: integer, format: int64, minimum: 0}
        version: {type: integer, format: int64, minimum: 0}
    GmailAuthorization:
      type: object
      required: [authorizationUrl, expiresAt]
      properties:
        authorizationUrl: {type: string, format: uri}
        expiresAt: {type: string, format: date-time}
    TestGmailResult:
      type: object
      required: [sentAt]
      properties:
        gmailMessageId: {type: [string, "null"]}
        sentAt: {type: string, format: date-time}
    TenantStorageUsage:
      type: object
      required: [tenantId, quotaBytes, usedBytes, remainingBytes, stagingBytes, version]
      properties:
        tenantId: {type: string, format: uuid}
        quotaBytes: {type: integer, format: int64}
        usedBytes: {type: integer, format: int64}
        remainingBytes: {type: integer, format: int64}
        stagingBytes: {type: integer, format: int64}
        version: {type: integer}
    LoginCredentials:
      type: object
      required: [username, password]
      properties: {username: {type: string}, password: {type: string, format: password}}
    CreateTenant:
      type: object
      required: [name, slug, initialAdmin]
      properties:
        name: {type: string}
        slug: {type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"}
        initialAdmin: {type: object, required: [username, displayName], properties: {username: {type: string}, displayName: {type: string}, email: {type: string, format: email}}}
    CreateAccount:
      type: object
      required: [profileType, username, displayName, roles]
      properties:
        profileType: {type: string, enum: [STAFF, TEACHER, STUDENT]}
        username: {type: string}
        displayName: {type: string}
        email: {type: string, format: email}
        roles: {type: array, minItems: 1, items: {type: string}}
        parentName: {type: string}
        parentPhone: {type: string}
    Tenant:
      type: object
      required: [id, slug, name, status]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        status: {type: string, enum: [ACTIVE, LOCKED]}
    AuthSession:
      type: object
      required: [token, scope, user, expiresAt]
      properties:
        token: {type: string}
        scope: {type: string, enum: [PLATFORM, TENANT]}
        user:
          type: object
          properties:
            id: {type: string, format: uuid}
            tenantId: {type: string, format: uuid}
            username: {type: string}
            displayName: {type: string}
            roles: {type: array, items: {type: string}}
            status: {type: string}
            passwordState: {type: string}
        tenant: {oneOf: [{$ref: "#/components/schemas/Tenant"}, {type: "null"}]}
        expiresAt: {type: string, format: date-time}
    MessageResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          example: Nếu tài khoản tồn tại, hướng dẫn đặt lại mật khẩu sẽ được gửi tới email đã đăng ký.
    DashboardData:
      type: object
      required: [date, greetingName, kpis, attentionItems, classStates]
      properties:
        date: {type: string, format: date}
        greetingName: {type: string}
        kpis:
          type: array
          items:
            type: object
            required: [id, label, value, detail]
            properties:
              id: {type: string}
              label: {type: string}
              value: {type: string}
              detail: {type: string}
              delta: {type: [string, "null"]}
        attentionItems:
          type: array
          items:
            type: object
            required: [id, title, detail, actionLabel, severity]
            properties:
              id: {type: string}
              title: {type: string}
              detail: {type: string}
              actionLabel: {type: string}
              severity: {type: string, enum: [warning, danger, info]}
              targetSessionId: {type: [string, "null"], format: uuid}
        classStates:
          type: array
          items:
            type: object
            required: [status, label, count]
            properties:
              status:
                type: string
                enum: [Active, AwaitingClose, Closed]
              label: {type: string}
              count: {type: integer, minimum: 0}
    TeacherOption:
      type: object
      required: [id, name]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
    RoomOption:
      type: object
      required: [id, code, name, capacity, status]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        capacity: {type: integer, minimum: 1}
        status: {type: string, enum: [ACTIVE, INACTIVE]}
    StudentOption:
      type: object
      required: [id, code, name]
      properties:
        id: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
    SchedulingOptions:
      type: object
      required: [teachers, rooms]
      properties:
        teachers: {type: array, items: {$ref: "#/components/schemas/TeacherOption"}}
        rooms: {type: array, items: {$ref: "#/components/schemas/RoomOption"}}
    WeeklyPattern:
      type: object
      description: Không có URL online.
      required: [id, weekday, startTime, endTime, mode]
      properties:
        id: {type: string}
        weekday: {type: integer, minimum: 1, maximum: 7, description: ISO Monday=1}
        startTime: {type: string, pattern: '^\d{2}:\d{2}(:\d{2})?$', example: "19:00"}
        endTime: {type: string, pattern: '^\d{2}:\d{2}(:\d{2})?$', example: "20:30"}
        mode: {type: string, enum: [IN_PERSON, ONLINE]}
        roomId: {type: [string, "null"], format: uuid}
    SessionOverride:
      type: object
      description: Chỉ đổi hình thức/phòng của ứng viên; không có URL.
      required: [sessionKey, mode]
      properties:
        sessionKey: {type: string, example: "mon-evening@2026-08-03"}
        mode: {type: string, enum: [IN_PERSON, ONLINE]}
        roomId: {type: [string, "null"], format: uuid}
    ClassDraftInput:
      type: object
      required:
        - name
        - primaryTeacherId
        - startDate
        - totalSessions
        - tuitionAmount
        - hourlyRate
        - defaultMode
      properties:
        name: {type: string, minLength: 1}
        description: {type: string, default: ""}
        primaryTeacherId: {type: string, format: uuid}
        startDate: {type: string, format: date}
        totalSessions: {type: integer, minimum: 1}
        tuitionAmount: {type: number, exclusiveMinimum: 0}
        hourlyRate: {type: number, exclusiveMinimum: 0}
        capacity: {type: [integer, "null"], minimum: 1}
        defaultMode: {type: string, enum: [IN_PERSON, ONLINE]}
        studentIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        patterns: {type: array, items: {$ref: "#/components/schemas/WeeklyPattern"}}
        overrides: {type: array, items: {$ref: "#/components/schemas/SessionOverride"}}
    ClassDraftRecord:
      allOf:
        - {$ref: "#/components/schemas/ClassDraftInput"}
        - type: object
          required: [id, code, status, version]
          properties:
            id: {type: string, format: uuid}
            code: {type: string}
            status: {const: Draft}
            version: {type: integer, format: int64}
    ScheduleConflict:
      type: object
      required: [id, code, severity, proposedSessionKey, studentNames, conflictingSession]
      properties:
        id: {type: string}
        code: {type: string, enum: [TEACHER_OVERLAP, ROOM_OVERLAP, STUDENT_OVERLAP]}
        severity: {type: string, enum: [BLOCKING, WARNING]}
        proposedSessionKey: {type: string}
        studentNames: {type: array, items: {type: string}}
        conflictingSession: {type: object}
    PreviewSession:
      type: object
      properties:
        key: {type: string}
        ordinal: {type: integer}
        startAt: {type: string, format: date-time}
        endAt: {type: string, format: date-time}
        teacherId: {type: string, format: uuid}
        teacherName: {type: string}
        mode: {type: string, enum: [IN_PERSON, ONLINE]}
        roomId: {type: [string, "null"], format: uuid}
        roomName: {type: [string, "null"]}
    SchedulePreview:
      type: object
      required:
        [previewId, generatedAt, expiresAt, inputVersion, sessions, skippedHolidays, expectedEndDate, conflicts]
      properties:
        previewId: {type: string, format: uuid}
        generatedAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time}
        inputVersion: {type: string}
        sessions: {type: array, items: {$ref: "#/components/schemas/PreviewSession"}}
        skippedHolidays: {type: array, items: {type: object}}
        expectedEndDate: {type: string, format: date}
        conflicts: {type: array, items: {$ref: "#/components/schemas/ScheduleConflict"}}
    SessionScheduleInput:
      type: object
      description: Không có onlineUrl theo DEC-046.
      required: [mode, version]
      properties:
        mode: {type: string, enum: [IN_PERSON, ONLINE]}
        roomId: {type: [string, "null"], format: uuid}
        version: {type: integer, format: int64, minimum: 0}
    SubstitutionPreviewInput:
      type: object
      required: [teacherId, version]
      properties:
        teacherId: {type: string, format: uuid}
        note: {type: string}
        version: {type: integer, format: int64, minimum: 0}
    ApplySubstitutionInput:
      allOf:
        - {$ref: "#/components/schemas/SubstitutionPreviewInput"}
        - type: object
          required: [previewId]
          properties:
            previewId: {type: string, format: uuid}
            acknowledgedWarningIds: {type: array, items: {type: string}}
    MakeupScheduleInput:
      type: object
      required: [date, startTime, endTime, teacherId, mode]
      properties:
        date: {type: string, format: date}
        startTime: {type: string, format: time}
        endTime: {type: string, format: time}
        teacherId: {type: string, format: uuid}
        mode: {type: string, enum: [IN_PERSON, ONLINE]}
        roomId: {type: [string, "null"], format: uuid}
    MakeupPreviewInput:
      type: object
      required: [makeup, version]
      properties:
        makeup: {$ref: "#/components/schemas/MakeupScheduleInput"}
        version: {type: integer, format: int64, minimum: 0}
    CancelSessionInput:
      type: object
      required: [reason, version]
      properties:
        reason: {type: string, minLength: 1}
        version: {type: integer, format: int64, minimum: 0}
        makeup: {$ref: "#/components/schemas/MakeupScheduleInput"}
        previewId: {type: [string, "null"], format: uuid}
        acknowledgedWarningIds: {type: array, items: {type: string}}
    CreateMakeupInput:
      type: object
      required: [version, previewId, makeup]
      properties:
        version: {type: integer, format: int64, minimum: 0}
        previewId: {type: string, format: uuid}
        makeup: {$ref: "#/components/schemas/MakeupScheduleInput"}
        acknowledgedWarningIds: {type: array, items: {type: string}}
    SessionAction:
      type: string
      enum: [SUBSTITUTE_TEACHER, CANCEL_SESSION, CREATE_MAKEUP]
    SessionMutationView:
      type: object
      properties:
