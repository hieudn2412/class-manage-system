services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./class-backend/.env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: ./class-backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./class-backend/.env.prod
    depends_on:
      db:
        condition: service_healthy
      clamav:
        condition: service_healthy
    expose:
      - "8080"
    volumes:
      - private_files:/data/private-files
      - staging_files:/data/staging-files
      - maintenance_flags:/maintenance
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q UP"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --version >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

  frontend:
    build:
      context: ./class-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - ./class-backend/.env.prod
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
      - backend

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
  private_files:
  staging_files:
  maintenance_flags:
  clamav_data:
  caddy_data:
  caddy_config:
