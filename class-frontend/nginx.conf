server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Serve OAuth verification documents directly for both URL forms. Letting
    # nginx redirect a directory to its trailing-slash form behind Caddy would
    # expose the internal http://...:8080 address to Google verification bots.
    location = /about {
        try_files /about/homepage.html =404;
    }

    location = /about/ {
        try_files /about/homepage.html =404;
    }

    location = /privacy {
        try_files /privacy/index.html =404;
    }

    location = /privacy/ {
        try_files /privacy/index.html =404;
    }

    location = /terms {
        try_files /terms/index.html =404;
    }

    location = /terms/ {
        try_files /terms/index.html =404;
    }

    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
